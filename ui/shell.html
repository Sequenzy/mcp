<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'none'; script-src 'unsafe-inline'; style-src 'unsafe-inline'; img-src https: data:; font-src 'none'; connect-src 'none'; frame-src 'none'; base-uri 'none'; form-action 'none'"
    />
    <title>Sequenzy previews</title>
    <style>
      /* APP_STYLES */
    </style>
  </head>
  <body>
    <main class="preview-app">
      <header class="app-header">
        <div class="brand">
          <img src="/* APP_LOGO */" width="25" height="25" alt="" /><span
            >Sequenzy</span
          ><span class="brand-divider"></span
          ><span id="preview-label" class="preview-label">Preview</span>
        </div>
        <div class="header-actions">
          <button
            id="refresh"
            class="icon-button"
            aria-label="Refresh preview"
            title="Refresh preview"
            hidden
          ></button
          ><button
            id="expand"
            class="icon-button"
            aria-label="Open in a larger view"
            title="Open in a larger view"
            hidden
          ></button>
        </div>
      </header>
      <section class="heading-row">
        <div class="heading-copy">
          <button id="back" class="back-button" hidden>
            <span id="back-label">Sequence overview</span>
          </button>
          <h1 id="heading">Your preview</h1>
          <p id="subtitle">See how your emails and sequences come together.</p>
        </div>
        <span id="state" class="state-badge" hidden></span>
      </section>
      <div class="notice-row">
        <p id="status" role="status" aria-live="polite">Loading preview…</p>
        <button id="retry" class="retry-button" hidden>Try again</button>
      </div>
      <nav id="tabs" class="tabs" aria-label="Sequence preview views" hidden>
        <button id="flow-tab" aria-selected="true">Sequence flow</button
        ><button id="emails-tab" aria-selected="false">Emails</button>
      </nav>
      <section id="home-view" class="home-view" hidden></section>
      <section id="sequence-view" hidden>
        <div id="flow-panel" class="flow-panel">
          <div id="flow-viewport" class="flow-viewport">
            <div id="flow-space" class="flow-space">
              <div id="flow-canvas" class="flow-canvas"></div>
            </div>
          </div>
          <div class="flow-footer">
            <span
              ><span class="coral-dot"></span>Click an email to preview it</span
            >
            <div class="zoom-controls">
              <button id="zoom-out" aria-label="Zoom out"></button
              ><span id="zoom-level">100%</span
              ><button id="zoom-in" aria-label="Zoom in"></button
              ><span class="control-divider"></span
              ><button
                id="fit"
                aria-label="Fit flow to width"
                title="Fit to width"
              ></button>
            </div>
          </div>
        </div>
        <div id="email-list" class="email-list" hidden></div>
      </section>
      <section id="email-view" hidden>
        <div class="email-toolbar">
          <div id="step-navigation" class="step-navigation" hidden>
            <button
              id="previous"
              class="icon-button"
              aria-label="Previous email"
            ></button
            ><span id="step-label"></span
            ><button
              id="next"
              class="icon-button"
              aria-label="Next email"
            ></button>
          </div>
          <div id="variants" class="variants" aria-label="Email variants"></div>
          <button id="ask" class="ask-button" hidden>Ask for changes</button>
          <div class="device-switch" aria-label="Preview width">
            <button
              id="desktop"
              aria-label="Desktop preview"
              aria-pressed="true"
              title="Desktop, 640px"
            ></button
            ><button
              id="mobile"
              aria-label="Mobile preview"
              aria-pressed="false"
              title="Mobile, 375px"
            ></button>
          </div>
        </div>
        <div class="inbox-header">
          <div id="envelope" class="email-envelope"></div>
          <div>
            <p id="subject" class="subject"></p>
            <p id="preheader" class="preheader"></p>
          </div>
        </div>
        <div id="warnings" class="render-warnings" hidden></div>
        <div id="email-viewport" class="email-viewport">
          <div id="email-canvas" class="email-canvas">
            <iframe
              id="email-frame"
              title="Rendered email preview"
              sandbox=""
              referrerpolicy="no-referrer"
              hidden
            ></iframe>
          </div>
        </div>
        <footer class="email-footer">
          <span id="contact-mode">Sample contact</span
          ><span
            >Read-only preview <span class="footer-separator">·</span>
            <span id="device-size">640px</span></span
          >
        </footer>
      </section>
      <section id="secondary-view" hidden></section>
      <footer class="app-footer">Made with care. Sent with Sequenzy.</footer>
    </main>
    <script type="module">
      /* APP_SCRIPT */
    </script>
  </body>
</html>
